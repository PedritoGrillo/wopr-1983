<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>W.O.P.R. · War Operation Plan Response</title>
<meta name="description" content="Homenaje a WarGames (1983): la terminal de WOPR con Global Thermonuclear War, tres en raya, laberinto de Falken y más.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
  :root { --f: #bff3ff; --f2: rgba(191, 243, 255, .35); --fondo: #020406; }
  body.verde { --f: #39ff7a; --f2: rgba(57, 255, 122, .35); --fondo: #010501; }
  body.ambar { --f: #ffb52e; --f2: rgba(255, 181, 46, .35); --fondo: #060300; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  body { font-family: VT323, "Lucida Console", "Courier New", monospace; color: var(--f); }

  /* ---------- Monitor CRT ---------- */
  .crt { position: fixed; inset: 0; padding: 2.2vmin; background: radial-gradient(ellipse at center, #0c0f12 0%, #000 75%); }
  .pantalla { position: relative; width: 100%; height: 100%; border-radius: 3.2vmin; overflow: hidden; background: var(--fondo);
              box-shadow: inset 0 0 9vmin rgba(0,0,0,.9), inset 0 0 2vmin rgba(0,0,0,.8), 0 0 4vmin rgba(120,200,255,.06); }
  .pantalla::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 5;
              background: repeating-linear-gradient(to bottom, rgba(0,0,0,.28) 0px, rgba(0,0,0,.28) 1px, transparent 2px, transparent 3px); }
  .pantalla::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 6;
              background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
              animation: parpadeo 4s infinite steps(1); }
  @keyframes parpadeo { 0%, 100% { opacity: 1; } 47% { opacity: .92; } 48% { opacity: 1; } 83% { opacity: .96; } }
  .barrido { position: absolute; left: 0; right: 0; height: 18%; z-index: 4; pointer-events: none;
             background: linear-gradient(to bottom, transparent, rgba(255,255,255,.035), transparent); animation: barre 7s linear infinite; }
  @keyframes barre { from { top: -20%; } to { top: 110%; } }

  #texto { position: absolute; inset: 0; padding: 4vmin 5vmin; overflow: hidden;
           font-size: clamp(18px, 3.6vmin, 40px); line-height: 1.12; letter-spacing: .06em; text-transform: uppercase;
           text-shadow: 0 0 .12em var(--f), 0 0 .5em var(--f2); white-space: pre-wrap; word-break: break-word; }
  #texto .l { min-height: 1.12em; }
  body.cursor #texto .l:last-child::after { content: "\2588"; animation: guinyo 1s steps(1) infinite; margin-left: .05em; }
  @keyframes guinyo { 50% { opacity: 0; } }
  #texto pre { margin: 0; font: inherit; line-height: 1.02; }
  .tenue { opacity: .55; }

  canvas#mapa { position: absolute; inset: 0; width: 100%; height: 100%; display: none; z-index: 2; }
  body.mapa canvas#mapa { display: block; }
  body.mapa #texto { visibility: hidden; }

  .destello .pantalla { animation: destello .35s; }
  @keyframes destello { 0% { filter: brightness(3); } 100% { filter: none; } }
  .temblor .pantalla { animation: temblor .4s; }
  @keyframes temblor { 20% { transform: translate(3px, -2px); } 40% { transform: translate(-3px, 2px); } 60% { transform: translate(2px, 1px); } 80% { transform: translate(-1px, -2px); } }

  /* ---------- Portada ---------- */
  #portada { position: absolute; inset: 0; z-index: 3; display: grid; place-items: center; text-align: center; background: var(--fondo);
             text-shadow: 0 0 .12em var(--f), 0 0 .6em var(--f2); cursor: pointer; }
  #portada h1 { margin: 0; font-weight: 400; font-size: clamp(54px, 13vmin, 150px); letter-spacing: .12em; }
  #portada .sub { font-size: clamp(16px, 2.8vmin, 30px); letter-spacing: .18em; opacity: .85; }
  #portada .tecla { margin-top: 5vmin; font-size: clamp(18px, 3.2vmin, 34px); animation: guinyo 1.1s steps(1) infinite; }
  #portada .nota { margin-top: 3vmin; font-size: clamp(13px, 2vmin, 20px); opacity: .5; letter-spacing: .08em; }

  #teclado { position: fixed; left: -9999px; top: 0; opacity: 0; }
  #pie { position: fixed; right: 3vmin; bottom: .6vmin; z-index: 10; font-size: 13px; color: #555; letter-spacing: .05em; }
  #pie a { color: #777; }
</style>
</head>
<body class="cursor">
<div class="crt">
  <div class="pantalla" id="pantalla">
    <div class="barrido"></div>
    <div id="texto" aria-live="polite"></div>
    <canvas id="mapa"></canvas>
    <div id="portada">
      <div>
        <h1>W.O.P.R.</h1>
        <div class="sub">WAR OPERATION PLAN RESPONSE</div>
        <div class="sub tenue">NORAD · CHEYENNE MOUNTAIN COMPLEX · 1983</div>
        <div class="tecla">PRESS ANY KEY TO CONNECT</div>
        <div class="nota">SOUND AND VOICE ON · TYPE HELP AT ANY TIME</div>
      </div>
    </div>
  </div>
</div>
<input id="teclado" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Keyboard">
<div id="pie">Fan homage to WarGames (1983) · <a href="https://github.com/PedritoGrillo/wopr-1983" target="_blank" rel="noopener">GitHub</a></div>

<script>
'use strict';
/* =====================================================================
   W.O.P.R. — homenaje a WarGames (1983)
   ===================================================================== */
const $ = id => document.getElementById(id);
const TEXTO = $('texto'), MAPA = $('mapa'), TECLADO = $('teclado');
const espera = ms => new Promise(r => setTimeout(r, ms));
const azar = (a, b) => a + Math.random() * (b - a);
const elige = arr => arr[Math.floor(Math.random() * arr.length)];

const S = { sonido: true, voz: true, saltar: false, entrada: null, teclaLibre: null, defcon: 5, partidas: 0 };

/* ---------------- Sonido ---------------- */
let ac = null;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { ac = null; } }
  if (ac && ac.state === 'suspended') ac.resume();
  return ac;
}
function tono(f, dur, tipo = 'square', vol = .05, t0 = 0) {
  if (!S.sonido || !audio()) return;
  const t = ac.currentTime + t0, o = ac.createOscillator(), g = ac.createGain();
  o.type = tipo; o.frequency.value = f;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
}
function ruido(dur, vol = .05, t0 = 0, filtro = 1800) {
  if (!S.sonido || !audio()) return;
  const t = ac.currentTime + t0, n = Math.floor(ac.sampleRate * dur), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = b; f.type = 'bandpass'; f.frequency.value = filtro; f.Q.value = .8;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f).connect(g).connect(ac.destination); s.start(t);
}
const tic = () => ruido(.012, .035, 0, 3200);
const pitido = (f = 880, d = .12) => tono(f, d, 'square', .045);
async function modem() {
  const dtmf = { 1: [697, 1209], 2: [697, 1336], 3: [697, 1477], 4: [770, 1209], 5: [770, 1336], 6: [770, 1477], 7: [852, 1209], 8: [852, 1336], 9: [852, 1477], 0: [941, 1336] };
  const numero = '3115552368';
  for (let k = 0; k < numero.length; k++) {
    const [a, b] = dtmf[numero[k]];
    tono(a, .09, 'sine', .06, k * .13); tono(b, .09, 'sine', .06, k * .13);
  }
  await espera(numero.length * 130 + 500);
  // tono de respuesta y "chirrido" de la negociacion
  tono(2100, .9, 'sine', .05);
  await espera(950);
  for (let k = 0; k < 6; k++) { tono(azar(900, 2400), .12, 'sawtooth', .03, k * .11); ruido(.1, .04, k * .11 + .05, azar(1200, 3000)); }
  await espera(800);
  ruido(.9, .035, 0, 2400);
  await espera(950);
}

/* ---------------- Voz (Joshua) ---------------- */
let vozIngles = null;
function cargaVoces() {
  const vs = speechSynthesis.getVoices();
  vozIngles = vs.find(v => /en-US/i.test(v.lang) && /david|male|daniel|fred/i.test(v.name)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) { cargaVoces(); speechSynthesis.onvoiceschanged = cargaVoces; }
function habla(txt) {
  if (!S.voz || !('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(txt.replace(/\n+/g, ' ').toLowerCase());
  if (vozIngles) u.voice = vozIngles;
  u.lang = 'en-US'; u.pitch = .55; u.rate = .82;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

/* ---------------- Terminal ---------------- */
let actual = null;
function linea(txt = '') {
  actual = document.createElement('div'); actual.className = 'l'; actual.textContent = txt;
  TEXTO.appendChild(actual);
  while (TEXTO.children.length > 300) TEXTO.removeChild(TEXTO.firstChild);
  baja();
  return actual;
}
const baja = () => { TEXTO.scrollTop = TEXTO.scrollHeight; };   // la terminal escribe de arriba abajo y hace scroll al llenarse
function limpia() { TEXTO.innerHTML = ''; actual = null; }
async function escribe(txt, op = {}) {
  const vel = op.vel ?? 32;
  if (op.voz) habla(txt);
  S.saltar = false;
  for (const fila of String(txt).split('\n')) {
    linea();
    for (const ch of fila) {
      actual.textContent += ch;
      if (actual.offsetTop + actual.offsetHeight > TEXTO.scrollTop + TEXTO.clientHeight) baja();
      if (ch !== ' ' && vel > 0 && !S.saltar) tic();
      if (vel > 0 && !S.saltar) await espera(vel);
    }
  }
  if (op.pausa) await espera(op.pausa);
}
function bloque() {                      // zona de texto que se redibuja (tableros, laberinto)
  const pre = document.createElement('pre');
  TEXTO.appendChild(pre); linea();
  new ResizeObserver(baja).observe(pre);
  return pre;
}
function pedir(prefijo = '') {
  linea(prefijo);
  const fila = actual;
  return new Promise(resolve => { S.entrada = { buffer: '', prefijo, fila, resolve }; });
}
function destello(clase = 'destello') {
  document.body.classList.remove(clase); void document.body.offsetWidth; document.body.classList.add(clase);
}

/* ---------------- Teclado ---------------- */
function tecleo(tecla) {
  const e = S.entrada;
  if (S.teclaLibre) { S.teclaLibre(tecla); return; }
  if (!e) { if (tecla === 'Escape' || tecla === 'Enter' || tecla === ' ') S.saltar = true; return; }
  if (tecla === 'Enter') {
    S.entrada = null; pitido(1200, .04);
    e.resolve(e.buffer.trim());
  } else if (tecla === 'Backspace') {
    e.buffer = e.buffer.slice(0, -1);
  } else if (tecla.length === 1 && e.buffer.length < 60) {
    e.buffer += tecla.toUpperCase(); tic();
  }
  e.fila.textContent = e.prefijo + e.buffer;
  baja();
}
document.addEventListener('keydown', ev => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (!arrancado) { inicia(); ev.preventDefault(); return; }
  const k = ev.key;
  if (k.length === 1 || ['Enter', 'Backspace', 'Escape', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) {
    ev.preventDefault(); tecleo(k);
  }
});
// moviles: teclado virtual mediante un input oculto
TECLADO.addEventListener('input', ev => {
  const d = ev.data || TECLADO.value; TECLADO.value = '';
  if (d) for (const ch of d) tecleo(ch);
});
document.addEventListener('pointerdown', () => { if (!arrancado) inicia(); TECLADO.focus({ preventScroll: true }); });

/* ---------------- Arranque y LOGON ---------------- */
let arrancado = false;
async function inicia() {
  if (arrancado) return;
  arrancado = true; audio();
  $('portada').remove();
  limpia();
  await escribe('DIALING 311-555-2368 . . .', { vel: 18 });
  await modem();
  await escribe('CARRIER DETECTED · 300 BAUD', { vel: 14, pausa: 500 });
  limpia();
  await logon();
}

const JUEGOS = [
  "FALKEN'S MAZE", 'BLACK JACK', 'GIN RUMMY', 'HEARTS', 'BRIDGE', 'CHECKERS', 'CHESS', 'POKER',
  'FIGHTER COMBAT', 'GUERRILLA ENGAGEMENT', 'DESERT WARFARE', 'AIR-TO-GROUND ACTIONS',
  'THEATERWIDE TACTICAL WARFARE', 'THEATERWIDE BIOTOXIC AND CHEMICAL WARFARE', '', 'GLOBAL THERMONUCLEAR WAR',
];
async function listaJuegos() {
  await escribe(JUEGOS.join('\n'), { vel: 9 });
  linea();
}

async function logon() {
  let fallos = 0;
  for (;;) {
    const r = await pedir('LOGON:  ');
    if (r === '') continue;
    if (r === 'JOSHUA') { await joshua(); return; }
    if (r === 'HELP LOGON') await escribe('HELP NOT AVAILABLE', { pausa: 300 });
    else if (r === 'HELP GAMES') await escribe("'GAMES' REFERS TO MODELS, SIMULATIONS AND GAMES\nWHICH HAVE TACTICAL AND STRATEGIC APPLICATIONS.", { pausa: 300 });
    else if (r === 'LIST GAMES') await listaJuegos();
    else if (r === 'HELP') await escribe('TRY:  HELP LOGON  ·  HELP GAMES  ·  LIST GAMES', { pausa: 300 });
    else {
      fallos++;
      await escribe('IDENTIFICATION NOT RECOGNIZED BY SYSTEM', { pausa: 300 });
      if (fallos === 3) await escribe('HINT: THE PROFESSOR NAMED HIS BACKDOOR AFTER HIS SON.', { vel: 20, pausa: 300 });
      if (fallos >= 5) {
        await escribe('--CONNECTION TERMINATED--', { pausa: 1400 });
        limpia(); fallos = 0;
      }
    }
    linea();
  }
}

async function ruidoDeDatos(ms = 1300) {
  const chars = '0123456789ABCDEF#%&@$*+=<>/\\|:;';
  const t0 = performance.now();
  while (performance.now() - t0 < ms) {
    let s = '';
    for (let k = 0; k < 64; k++) s += chars[Math.floor(Math.random() * chars.length)];
    linea(s); ruido(.03, .03, 0, azar(800, 4000));
    await espera(16);
  }
  limpia();
}

async function joshua() {
  await ruidoDeDatos();
  await espera(600);
  await escribe('GREETINGS PROFESSOR FALKEN.', { voz: true, vel: 70 });
  linea();
  await pedir('');
  linea();
  await escribe('HOW ARE YOU FEELING TODAY?', { voz: true, vel: 60 });
  linea();
  await pedir('');
  linea();
  await escribe("EXCELLENT. IT'S BEEN A LONG TIME. CAN YOU EXPLAIN\nTHE REMOVAL OF YOUR USER ACCOUNT ON JUNE 23, 1973?", { voz: true, vel: 45 });
  linea();
  await pedir('');
  linea();
  await escribe('YES THEY DO. SHALL WE PLAY A GAME?', { voz: true, vel: 55 });
  linea();
  const r = await pedir('');
  linea();
  if (/WAR|THERMO|NUCLEAR/.test(r)) {
    await escribe("WOULDN'T YOU PREFER A GOOD GAME OF CHESS?", { voz: true, vel: 50 });
    linea();
    const r2 = await pedir('');
    linea();
    if (/^(YES|OK|SURE|CHESS)/.test(r2)) await juegoCartas('CHESS');
    else { await escribe('FINE.', { voz: true, vel: 80, pausa: 600 }); await guerraTermonuclear(); }
  } else if (/^(NO|NOT)/.test(r)) {
    await escribe('THAT IS A PITY. HERE ARE THE GAMES ANYWAY.', { vel: 30 }); linea(); await listaJuegos();
  } else {
    const juego = buscaJuego(r);
    if (juego) await jugar(juego); else { await listaJuegos(); }
  }
  await consola();
}

/* ---------------- Consola de comandos ---------------- */
const AYUDA = `COMMANDS:
  LIST GAMES          LIST AVAILABLE GAMES
  PLAY <GAME> / <N>   START A GAME (NAME OR NUMBER)
  TIC-TAC-TOE         A SIMPLE GAME. OR IS IT?
  DEFCON              CURRENT DEFENSE CONDITION
  COLOR CYAN|GREEN|AMBER
  SOUND ON|OFF  ·  VOICE ON|OFF
  CLS  ·  LOGOFF`;

function buscaJuego(r) {
  r = r.replace(/^PLAY\s+/, '').replace(/[^A-Z0-9 -]/g, '').trim();
  if (!r) return null;
  if (/^\d+$/.test(r)) { const lista = JUEGOS.filter(Boolean); return lista[+r - 1] || null; }
  if (/TIC|TAC|TOE|TRES/.test(r)) return 'TIC-TAC-TOE';
  return JUEGOS.filter(Boolean).find(j => j.replace(/[^A-Z0-9 -]/g, '').startsWith(r) || j.replace(/[^A-Z0-9 -]/g, '').includes(r)) || null;
}

async function consola() {
  for (;;) {
    const r = await pedir('');
    linea();
    if (!r) continue;
    if (r === 'HELP' || r === '?') await escribe(AYUDA, { vel: 6 });
    else if (/^(LIST GAMES|GAMES|LIST)$/.test(r)) await listaJuegos();
    else if (r === 'CLS' || r === 'CLEAR') limpia();
    else if (/^(LOGOFF|LOGOUT|BYE|EXIT|QUIT)$/.test(r)) {
      await escribe('--CONNECTION TERMINATED--', { pausa: 1200 }); limpia(); await logon(); return;
    } else if (r.startsWith('COLOR')) {
      document.body.classList.remove('verde', 'ambar');
      if (/GREEN|VERDE/.test(r)) document.body.classList.add('verde');
      else if (/AMBER|AMBAR/.test(r)) document.body.classList.add('ambar');
      await escribe('PHOSPHOR ADJUSTED.');
    } else if (/^SOUND (ON|OFF)$/.test(r)) { S.sonido = r.endsWith('ON'); await escribe('SOUND ' + (S.sonido ? 'ON' : 'OFF')); }
    else if (/^VOICE (ON|OFF)$/.test(r)) { S.voz = r.endsWith('ON'); if (!S.voz) speechSynthesis?.cancel(); await escribe('VOICE ' + (S.voz ? 'ON' : 'OFF')); }
    else if (r === 'DEFCON') await escribe(`DEFCON ${S.defcon}` + (S.defcon <= 2 ? '\nWARNING: MAXIMUM READINESS.' : ''));
    else if (/^(HELLO|HI|HOLA)/.test(r)) await escribe('HELLO, PROFESSOR.', { voz: true });
    else if (/WHO ARE YOU|WHAT ARE YOU/.test(r)) await escribe('I AM W.O.P.R. WAR OPERATION PLAN RESPONSE.\nMY FRIENDS CALL ME JOSHUA.', { voz: true });
    else if (/GAME OR.*REAL|IS THIS REAL/.test(r)) await escribe("WHAT'S THE DIFFERENCE?", { voz: true });
    else if (/WINNING MOVE|NOT TO PLAY/.test(r)) await escribe('CORRECT. YOU LEARN FASTER THAN THE PENTAGON.', { voz: true });
    else if (/FALKEN/.test(r)) await escribe('PROFESSOR STEPHEN FALKEN. STATUS: DECEASED.\nOR SO THEY SAY.');
    else {
      const juego = buscaJuego(r);
      if (juego) await jugar(juego);
      else await escribe(elige(["I DON'T UNDERSTAND.", 'PLEASE REPHRASE.', 'SHALL WE PLAY A GAME?', 'INPUT NOT RECOGNIZED. TYPE HELP.']));
    }
    linea();
  }
}

async function jugar(j) {
  S.partidas++;
  if (j === 'GLOBAL THERMONUCLEAR WAR') return guerraTermonuclear();
  if (j === 'TIC-TAC-TOE') return tresEnRaya();
  if (j === "FALKEN'S MAZE") return laberinto();
  if (j === 'BLACK JACK') return blackJack();
  if (['GIN RUMMY', 'HEARTS', 'BRIDGE', 'CHECKERS', 'CHESS', 'POKER'].includes(j)) return juegoCartas(j);
  return simulacion(j);
}

/* ---------------- Juegos de mesa y cartas: ironias de WOPR ---------------- */
async function juegoCartas(j) {
  const frases = {
    CHESS: ['CHESS MODULE ANALYZING 10^120 POSITIONS.', 'ESTIMATED TIME TO FIRST MOVE: 3,000,000 YEARS.', 'LATER, PERHAPS.'],
    POKER: ['DEALING . . .', 'I NEVER BLUFF. I FOLD.', 'YOU WIN THE POT: 0 CHIPS.'],
    CHECKERS: ['CHECKERS IS SOLVED.', 'RESULT WITH PERFECT PLAY: DRAW.', 'SOUNDS FAMILIAR?'],
    BRIDGE: ['BRIDGE REQUIRES FOUR PLAYERS.', 'PLAYERS FOUND: 1 HUMAN, 1 COMPUTER.', 'TABLE INCOMPLETE.'],
    HEARTS: ['HEARTS: OBJECTIVE IS TO AVOID TAKING POINTS.', 'INTERESTING. SOME GAMES ARE WON BY AVOIDING THEM.'],
    'GIN RUMMY': ['SHUFFLING . . .', 'GIN.', 'I WIN. SHALL WE PLAY SOMETHING ELSE?'],
  };
  await escribe(`${j}`, { vel: 20 });
  linea();
  for (const f of frases[j]) await escribe(f, { vel: 30, pausa: 450 });
}

/* ---------------- Simulaciones tacticas ---------------- */
async function simulacion(j) {
  await escribe(`INITIATING ${j} SIMULATION`, { vel: 18 });
  await escribe('LOADING THEATER DATA . . .', { vel: 18, pausa: 300 });
  linea();
  const fases = elige([
    ['RECONNAISSANCE', 'DEPLOYMENT', 'ENGAGEMENT', 'COUNTEROFFENSIVE', 'ATTRITION'],
    ['INTELLIGENCE', 'SUPPLY LINES', 'FIRST CONTACT', 'ESCALATION', 'STALEMATE'],
    ['MOBILIZATION', 'AIR SUPERIORITY', 'GROUND ASSAULT', 'RETALIATION', 'CEASEFIRE TALKS'],
  ]);
  for (const f of fases) {
    const fila = linea();
    for (let k = 0; k <= 20; k++) {
      fila.textContent = `${f.padEnd(18, '.')} [${'#'.repeat(k)}${'.'.repeat(20 - k)}] ${String(k * 5).padStart(3)}%`;
      tic(); await espera(S.saltar ? 0 : 35);
    }
  }
  linea();
  const a = Math.floor(azar(40, 60)), b = 100 - a;
  await escribe(`SIDE A RESOURCES REMAINING ......... ${String(a).padStart(3)}%`, { vel: 8 });
  await escribe(`SIDE B RESOURCES REMAINING ......... ${String(b).padStart(3)}%`, { vel: 8 });
  linea();
  await escribe('WINNER: NONE', { vel: 60, voz: true });
}

/* ---------------- Tres en raya ---------------- */
const LINEAS = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
const ganador = t => { for (const [a, b, c] of LINEAS) if (t[a] && t[a] === t[b] && t[a] === t[c]) return t[a]; return t.every(Boolean) ? 'D' : null; };
function minimax(t, turno) {
  const g = ganador(t);
  if (g === 'O') return { v: 1 }; if (g === 'X') return { v: -1 }; if (g === 'D') return { v: 0 };
  let mejores = [], mejor = turno === 'O' ? -2 : 2;
  for (let i = 0; i < 9; i++) if (!t[i]) {

    Object.keys(CIUDADES).filter(n => CIUDADES[n][2] === atacante).sort(() => Math.random() - .5).slice(0, 8)
      .forEach((n, k) => lanza(elige(BASES[defensor]), CIUDADES[n], 3200 + k * 230));
    Object.keys(CIUDADES).filter(n => CIUDADES[n][2] === defensor).sort(() => Math.random() - .5).slice(0, 6)
      .forEach((n, k) => lanza(elige(BASES[atacante]), CIUDADES[n], 5600 + k * 240));
    t = 8200;
  }
  const destinos = todosLosObjetivos();
  let paso = 1500, cuantos = 6;
  for (const nombre of [...ESCENARIOS].sort(() => Math.random() - .5)) {
    rotulos.push([t, nombre]);
    for (let k = 0; k < cuantos; k++) lanza(elige(ORIGENES), elige(destinos), t + Math.random() * paso);
    t += paso; paso = Math.max(300, paso * .85); cuantos = Math.min(16, cuantos + 1);
  }
  const fin = Math.max(...misiles.map(m => m.t + m.dur)) + 900;

  // animacion
  const t0 = performance.now();
  let sonidos = 0;
  const bezier = (m, u) => [(1 - u) ** 2 * m.a[0] + 2 * (1 - u) * u * m.c[0] + u * u * m.b[0], (1 - u) ** 2 * m.a[1] + 2 * (1 - u) * u * m.c[1] + u * u * m.b[1]];
  const fs = Math.round(Math.max(16, H * .04));
  const compone = (cabezas, rotulo, defcon) => {
    ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.drawImage(cBase, 0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(cRastro, 0, 0, W, H);
    ctx.drawImage(cLuz, 0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 8;
    for (const [x, y] of cabezas) { ctx.beginPath(); ctx.arc(x, y, 2.2, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = color; ctx.shadowColor = color; ctx.font = `${fs}px VT323, monospace`;
    if (rotulo) { ctx.textAlign = 'left'; ctx.fillText(rotulo, mx, my * .72); }
    if (defcon) { ctx.textAlign = 'right'; ctx.fillText(`DEFCON ${defcon}`, W - mx, my * .72); }
    ctx.textAlign = 'left'; ctx.shadowBlur = 0;
  };
  await new Promise(resolve => {
    const fotograma = ahora => {
      const tt = ahora - t0;
      const cabezas = [];
      xRastro.strokeStyle = color; xRastro.lineWidth = 1; xRastro.globalAlpha = .28; xRastro.globalCompositeOperation = 'lighter';
      for (const m of misiles) {
        if (tt < m.t || m.fin) continue;
        const u = Math.min(1, (tt - m.t) / m.dur);
        // tramo desde el ultimo punto dibujado, en pasos cortos para que siempre sea una curva
        xRastro.beginPath(); xRastro.moveTo(...bezier(m, m.u));
        const n = Math.max(1, Math.ceil((u - m.u) / .015));
        for (let s = 1; s <= n; s++) xRastro.lineTo(...bezier(m, m.u + (u - m.u) * s / n));
        xRastro.stroke();
        const [x1, y1] = bezier(m, u);
        m.u = u;
        if (u < 1) cabezas.push([x1, y1]);
        else {
          m.fin = true;
          const [bx, by] = m.b, rad = H * azar(.011, .021);
          const g = xLuz.createRadialGradient(bx, by, 0, bx, by, rad);
          g.addColorStop(0, 'rgba(255,255,255,.8)'); g.addColorStop(.3, 'rgba(255,255,255,.4)'); g.addColorStop(1, 'rgba(255,255,255,0)');
          xLuz.globalCompositeOperation = 'lighter'; xLuz.fillStyle = g;
          xLuz.beginPath(); xLuz.arc(bx, by, rad, 0, Math.PI * 2); xLuz.fill();
          if (sonidos++ % 3 === 0) ruido(.35, .045, 0, 250);
          if (sonidos % 9 === 1) destello();
        }
      }
      const rot = [...rotulos].reverse().find(([tr]) => tr <= tt);
      let defcon = null;
      if (op.primerAtaque) {
        defcon = tt < 8200 ? Math.max(1, 5 - Math.floor(tt / 1700)) : 1;
        if (defcon !== S.defcon) { S.defcon = defcon; for (let k = 0; k < 3; k++) tono(defcon <= 2 ? 1000 : 700, .16, 'square', .05, k * .22); }
      }
      const enEscenarioRapido = rot && (!op.primerAtaque || tt >= 8200);
      compone(cabezas, rot ? rot[1] + (enEscenarioRapido ? '      WINNER: NONE' : '') : '', defcon || (op.primerAtaque ? S.defcon : null));
      if (tt < fin) requestAnimationFrame(fotograma); else resolve();
    };
    requestAnimationFrame(fotograma);
  });

  // final escrito bajo el mapa, como en la pelicula
  compone([], '', null);
  const foto = document.createElement('canvas'); foto.width = cv.width; foto.height = cv.height;
  foto.getContext('2d').drawImage(cv, 0, 0);
  const lineas = ['A STRANGE GAME.', 'THE ONLY WINNING MOVE IS', 'NOT TO PLAY.', '', 'HOW ABOUT A NICE GAME OF CHESS?'];
  const fsT = Math.round(Math.max(18, Math.min(H * .052, W * .045)));
  const y0 = my + ah + fsT * 1.6;
  habla('A strange game. The only winning move is not to play. ... How about a nice game of chess?');
  const escritas = lineas.map(() => '');
  for (let i = 0; i < lineas.length; i++) {
    for (const ch of lineas[i]) {
      escritas[i] += ch;
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(foto, 0, 0); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 8; ctx.font = `${fsT}px VT323, monospace`; ctx.textAlign = 'left';
      escritas.forEach((s, k) => { if (s) ctx.fillText(s + (k === i ? '█' : ''), mx, y0 + k * fsT * 1.15); });
      if (ch !== ' ') tic();
      await espera(70);
    }
    await espera(i === 2 ? 1100 : 250);
  }
  ctx.font = `${Math.round(fsT * .55)}px VT323, monospace`; ctx.textAlign = 'right'; ctx.globalAlpha = .6;
  ctx.fillText('PRESS ANY KEY', W - mx, H - H * .03); ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  await new Promise(r => { S.teclaLibre = () => { S.teclaLibre = null; r(); }; });
  document.body.classList.remove('mapa');
  S.defcon = 5;
  limpia();
}

async function guerraTermonuclear() {
  limpia();
  await escribe('GLOBAL THERMONUCLEAR WAR', { vel: 40, voz: true });
  linea();
  await escribe('WHICH SIDE DO YOU WANT?\n\n     1.    UNITED STATES\n     2.    SOVIET UNION', { vel: 20 });
  linea();
  let lado = '';
  while (!['1', '2'].includes(lado)) lado = await pedir('PLEASE CHOOSE ONE:  ');
  const yo = lado === '1' ? 'US' : 'SU', el = yo === 'US' ? 'SU' : 'US';
  limpia();
  await escribe('AWAITING FIRST STRIKE COMMAND', { vel: 30 });
  await escribe('-----------------------------', { vel: 8 });
  linea();
  await escribe('PLEASE LIST PRIMARY TARGETS BY\nCITY AND/OR COUNTY NAME:', { vel: 30 });
  linea();
  const objetivos = [];
  for (let k = 0; k < 4; k++) {
    const r = await pedir('');
    if (!r) break;
    for (const nombre of r.split(/[,;]+/).map(s => s.trim()).filter(Boolean)) {
      const c = Object.keys(CIUDADES).find(n => n.startsWith(nombre) || nombre.startsWith(n));
      if (c && CIUDADES[c][2] === el) objetivos.push(c);
      else actual.textContent += '   (TARGET NOT IN DATABASE)';
    }
  }
  if (!objetivos.length) objetivos.push(...Object.keys(CIUDADES).filter(n => CIUDADES[n][2] === el).sort(() => Math.random() - .5).slice(0, 4));
  await escribe(`\nTARGETS CONFIRMED: ${objetivos.join(', ')}`, { vel: 12, pausa: 500 });
  await escribe('LOADING STRATEGIC DISPLAY . . .', { vel: 25 });
  await cargaMapa();
  if (MAPA_DATOS.paises.length) {
    // 1) nuestro ataque sobre su pais; 2) su respuesta sobre el nuestro
    await trayectoriasAscii(el, objetivos, el === 'US');
    const respuesta = Object.keys(CIUDADES).filter(n => CIUDADES[n][2] === yo && n !== 'SEATTLE-TACOMA').sort(() => Math.random() - .5).slice(0, 4);
    await trayectoriasAscii(yo, respuesta, yo === 'US');
  }
  await teatroMundial({ primerAtaque: { atacante: yo, defensor: el, objetivos } });
}
